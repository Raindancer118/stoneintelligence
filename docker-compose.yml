# Rotation, damit json-file-Logs die Platte nicht fuellen; Format der Java-Logs per
# LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (oder logstash) auf JSON umstellbar.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-java-service: &java-service
  logging: *logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    logging: *logging
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    environment:
      POSTGRES_DB: stoneintelligence
      POSTGRES_USER: ${STONEINTELLIGENCE_DB_USER:-stoneintelligence}
      POSTGRES_PASSWORD: ${STONEINTELLIGENCE_DB_PASSWORD:?set STONEINTELLIGENCE_DB_PASSWORD}
    volumes:
      - stoneintelligence-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform-api:
    <<: *java-service
    build:
      context: .
      dockerfile: platform-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STONEINTELLIGENCE_DB_URL: jdbc:postgresql://postgres:5432/stoneintelligence
      STONEINTELLIGENCE_DB_USER: ${STONEINTELLIGENCE_DB_USER:-stoneintelligence}
      STONEINTELLIGENCE_DB_PASSWORD: ${STONEINTELLIGENCE_DB_PASSWORD:?set STONEINTELLIGENCE_DB_PASSWORD}
      STONEINTELLIGENCE_OIDC_ISSUER_URI: ${STONEINTELLIGENCE_OIDC_ISSUER_URI:-}
      # Firmen-Login (ADR 0013, docs/scim.md): wer die Person ist, ihre Gruppen, ihr Name
      STONEINTELLIGENCE_OIDC_PRINCIPAL_CLAIM: ${STONEINTELLIGENCE_OIDC_PRINCIPAL_CLAIM:-preferred_username}
      STONEINTELLIGENCE_OIDC_GROUPS_CLAIM: ${STONEINTELLIGENCE_OIDC_GROUPS_CLAIM:-groups}
      STONEINTELLIGENCE_OIDC_NAME_CLAIM: ${STONEINTELLIGENCE_OIDC_NAME_CLAIM:-name}
      # SCIM 2.0 unter /scim/v2 - leer = aus; mehrere Tokens durch Komma (Wechsel ohne Ausfall)
      STONEINTELLIGENCE_SCIM_TOKEN: ${STONEINTELLIGENCE_SCIM_TOKEN:-}
      STONEINTELLIGENCE_SCIM_SUBJECT_ATTRIBUTE: ${STONEINTELLIGENCE_SCIM_SUBJECT_ATTRIBUTE:-userName}
      STONEINTELLIGENCE_SCIM_GROUP_KEY: ${STONEINTELLIGENCE_SCIM_GROUP_KEY:-displayName}
      # Adresse der Webapp: CORS und Einladungslinks
      STONEINTELLIGENCE_WEBAPP_URL: ${STONEINTELLIGENCE_WEBAPP_URL:-https://kb.tstieh.de}
      # "id|Name|Levels; ..." - leer = keine KI (s. AiServiceDirectory)
      STONEINTELLIGENCE_AI_SERVICES: ${STONEINTELLIGENCE_AI_SERVICES:-}
      STONEINTELLIGENCE_AI_WORKER_TOKEN: ${STONEINTELLIGENCE_AI_WORKER_TOKEN:-}
      # Dateien (ADR 0009): Grenzen je Datei und je Vault in MB
      STONEINTELLIGENCE_FILE_MAX_MB: ${STONEINTELLIGENCE_FILE_MAX_MB:-200}
      STONEINTELLIGENCE_FILE_QUOTA_MB: ${STONEINTELLIGENCE_FILE_QUOTA_MB:-5120}
    volumes:
      # Gehostet statt dessen die Storage Box einhaengen (bind, create_host_path: false - sonst landen
      # die Dateien bei nicht gemounteter Box unbemerkt auf der lokalen Platte).
      - stoneintelligence-files:/data/files
    ports:
      - "8080:8080"

  # KI-Worker (ADR 0008): kein Datenbankzugriff, alles ueber platform-api /internal. Welche Modelle
  # ein Dienst nutzt, steht in worker.env (AI_SERVICE_<ID>_FAST|SMART|VISION|ENDPOINT|KEYS,
  # GROQ_API_KEY, GOOGLE_API_KEY ...) - getrennt von .env, damit der Worker keine DB-Secrets sieht.
  intelligence-worker:
    <<: *java-service
    build:
      context: .
      dockerfile: intelligence-worker/Dockerfile
      secrets:
        - maven_settings
    restart: unless-stopped
    depends_on:
      - platform-api
    environment:
      STONEINTELLIGENCE_PLATFORM_API_URL: http://platform-api:8080
      STONEINTELLIGENCE_AI_WORKER_TOKEN: ${STONEINTELLIGENCE_AI_WORKER_TOKEN:-}
    env_file:
      - path: worker.env
        required: false
    # Antworten laufender Jobs: ein Job, der auf Kontingent wartet, macht nach einem Neustart weiter.
    volumes:
      - stoneintelligence-ai-resume:/data/ai-resume
    mem_limit: 1536m
    stop_grace_period: 140s

  mcp-adapter:
    <<: *java-service
    build:
      context: .
      dockerfile: mcp-adapter/Dockerfile
    restart: unless-stopped
    depends_on:
      - platform-api
      - intelligence-worker
    environment:
      STONEINTELLIGENCE_PLATFORM_API_URL: http://platform-api:8080
    ports:
      - "8082:8082"

volumes:
  stoneintelligence-postgres:
  stoneintelligence-files:
  stoneintelligence-ai-resume:

secrets:
  # Maven-settings.xml mit Lesezugang zu packages.tstieh.de (server-id packages-releases)
  maven_settings:
    file: ${MAVEN_SETTINGS_FILE:-./maven-settings.xml}

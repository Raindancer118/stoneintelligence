services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: stoneintelligence
      POSTGRES_USER: ${STONEINTELLIGENCE_DB_USER:-stoneintelligence}
      POSTGRES_PASSWORD: ${STONEINTELLIGENCE_DB_PASSWORD:?set STONEINTELLIGENCE_DB_PASSWORD}
    volumes:
      - stoneintelligence-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform-api:
    build:
      context: .
      dockerfile: platform-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STONEINTELLIGENCE_DB_URL: jdbc:postgresql://postgres:5432/stoneintelligence
      STONEINTELLIGENCE_DB_USER: ${STONEINTELLIGENCE_DB_USER:-stoneintelligence}
      STONEINTELLIGENCE_DB_PASSWORD: ${STONEINTELLIGENCE_DB_PASSWORD:?set STONEINTELLIGENCE_DB_PASSWORD}
      STONEINTELLIGENCE_OIDC_ISSUER_URI: ${STONEINTELLIGENCE_OIDC_ISSUER_URI:-}
      # "id|Name|Levels; ..." - leer = keine KI (s. AiServiceDirectory)
      STONEINTELLIGENCE_AI_SERVICES: ${STONEINTELLIGENCE_AI_SERVICES:-}
      STONEINTELLIGENCE_AI_WORKER_TOKEN: ${STONEINTELLIGENCE_AI_WORKER_TOKEN:-}
    ports:
      - "8080:8080"

  # KI-Worker (ADR 0008): kein Datenbankzugriff, alles ueber platform-api /internal. Welche Modelle
  # ein Dienst nutzt, steht in worker.env (AI_SERVICE_<ID>_FAST|SMART|VISION|ENDPOINT|KEYS,
  # GROQ_API_KEY, GOOGLE_API_KEY ...) - getrennt von .env, damit der Worker keine DB-Secrets sieht.
  intelligence-worker:
    build:
      context: .
      dockerfile: intelligence-worker/Dockerfile
      secrets:
        - maven_settings
    restart: unless-stopped
    depends_on:
      - platform-api
    environment:
      STONEINTELLIGENCE_PLATFORM_API_URL: http://platform-api:8080
      STONEINTELLIGENCE_AI_WORKER_TOKEN: ${STONEINTELLIGENCE_AI_WORKER_TOKEN:-}
    env_file:
      - path: worker.env
        required: false

  mcp-adapter:
    build:
      context: .
      dockerfile: mcp-adapter/Dockerfile
    restart: unless-stopped
    depends_on:
      - platform-api
      - intelligence-worker
    environment:
      STONEINTELLIGENCE_PLATFORM_API_URL: http://platform-api:8080
    ports:
      - "8082:8082"

volumes:
  stoneintelligence-postgres:

secrets:
  # Maven-settings.xml mit Lesezugang zu packages.tstieh.de (server-id packages-releases)
  maven_settings:
    file: ${MAVEN_SETTINGS_FILE:-./maven-settings.xml}

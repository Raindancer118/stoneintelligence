    @keyframes prow1 { 0% { opacity: 0 } 26% { opacity: 0 } 30% { opacity: 1 } 90% { opacity: 1 } 95% { opacity: 0 } }
    .p1 { animation: prow1 12s ease infinite; }
    @keyframes prow2 { 0% { opacity: 0 } 32% { opacity: 0 } 36% { opacity: 1 } 90% { opacity: 1 } 95% { opacity: 0 } }

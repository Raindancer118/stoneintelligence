    @keyframes prow3 { 0% { opacity: 0 } 38% { opacity: 0 } 42% { opacity: 1 } 90% { opacity: 1 } 95% { opacity: 0 } }
    .p3 { animation: prow3 12s ease infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # add_header in a location replaces everything inherited from the server block,
    # so every location that sets its own headers must include the shared set again.
    include /etc/nginx/snippets/security-headers.conf;

    # Hashed build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html (and the SPA fallback) must revalidate, or users keep a shell pointing at deleted assets.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

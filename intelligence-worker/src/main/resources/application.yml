spring:
  application:
    name: intelligence-worker
  threads:
    virtual:
      enabled: true

# Kein eigener Datenbankzugriff (ADR 0008): Jobs, Dokumente und Notizen kommen ueber platform-api.
server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO

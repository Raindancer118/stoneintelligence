spring:
  application:
    name: intelligence-worker
  threads:
    virtual:
      enabled: true
  # SIGTERM: der laufende Job darf zu Ende laufen (WorkerLoop holt keinen neuen); bleibt er laenger,
  # gibt die Lease von platform-api ihn nach 10 Minuten wieder frei. stop_grace_period im Compose passend.
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 120s
  lifecycle:
    timeout-per-shutdown-phase: 130s

# Kein eigener Datenbankzugriff (ADR 0008): Jobs, Dokumente und Notizen kommen ueber platform-api.
server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO

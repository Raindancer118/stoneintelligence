spring:
  application:
    name: platform-api

  datasource:
    url: ${STONEINTELLIGENCE_DB_URL:jdbc:postgresql://localhost:5432/stoneintelligence}
    username: ${STONEINTELLIGENCE_DB_USER:stoneintelligence}
    password: ${STONEINTELLIGENCE_DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # KI-Uploads (AiJobService): 100 MB je Datei (gescannte Buecher). Das Dashboard schickt jede Datei
  # einzeln - mehrere grosse Dateien in einer Anfrage wuerden den Heap sprengen.
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  flyway:
    schemas: platform
    default-schema: platform
    locations: classpath:db/migration/platform

# OIDC-Anbindung (Authentik) ist Gegenstand von Phase 3 (Identity & Authorization, s. Plan.md
# Abschnitt 6). Die konkrete spring.security.oauth2.*-Konfiguration wird dort ergaenzt, sobald
# Issuer/Client-Registrierung feststehen - ein leerer/ungueltiger Registrierungs-Block wuerde
# den Spring-Kontext schon beim Start scheitern lassen, deshalb bewusst noch nicht hier.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO

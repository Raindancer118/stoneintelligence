name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java-build-and-test:
    runs-on: ubuntu-latest
    env:
      # packages.tstieh.de (ai-gateway): Maven-HTTP-Transport scheitert dort am TLSv1.3-Handshake.
      MAVEN_OPTS: -Djdk.tls.client.protocols=TLSv1.2
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          # Nur-Lese-Token fuer die privaten eigenen Bibliotheken (ai-gateway, revolver).
          server-id: packages-releases
          server-username: MAVEN_REGISTRY_USERNAME
          server-password: MAVEN_REGISTRY_PASSWORD

      - name: Build and unit-test all modules
        run: ./mvnw -B -ntp verify
        env:
          MAVEN_REGISTRY_USERNAME: ${{ secrets.MAVEN_REGISTRY_USERNAME }}
          MAVEN_REGISTRY_PASSWORD: ${{ secrets.MAVEN_REGISTRY_PASSWORD }}

      - name: Upload surefire/failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore

  # Die naechtliche Sicherung auf dorn (ops/backup) - gegen eine echte Wegwerf-Postgres.
  backup-script-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test backup script
        run: ops/backup/test-backup.sh

  plugin-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build bundle
        run: node esbuild.config.mjs --production

  # Das Yjs-Bundle fuer die Java-API ist eingecheckt (platform-api/src/main/resources/yjs); dieser
  # Job stellt sicher, dass es exakt aus dem Quellcode (inkl. plugin/src/sync/textDiff.ts) entsteht.
  yjs-bridge-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            yjs-bridge/package-lock.json
            plugin/package-lock.json

      - name: Install dependencies (bridge imports the plugin's diff code)
        run: |
          (cd plugin && npm ci)
          (cd yjs-bridge && npm ci)

      - name: Typecheck and test
        working-directory: yjs-bridge
        run: |
          npx tsc --noEmit -p .
          npx vitest run

      - name: Bundle is up to date
        working-directory: yjs-bridge
        run: |
          npm run build
          git diff --exit-code -- ../platform-api/src/main/resources/yjs/yjs-bridge.js

  webapp-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile browser tests
        run: npm run test:e2e

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: webapp/test-results/
          if-no-files-found: ignore

      - name: Build
        run: npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # packages.tstieh.de (ai-gateway): Maven-HTTP-Transport scheitert dort am TLSv1.3-Handshake.
      MAVEN_OPTS: -Djdk.tls.client.protocols=TLSv1.2
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          # Nur-Lese-Token fuer die privaten eigenen Bibliotheken (ai-gateway, revolver).
          server-id: packages-releases
          server-username-env-var: MAVEN_REGISTRY_USERNAME
          server-password-env-var: MAVEN_REGISTRY_PASSWORD

      # Das lokale Embedding-Modell (ADR 0012) - dieselbe gepinnte Fassung wie im Worker-Image,
      # damit die Embedding-Tests gegen das echte Modell laufen statt uebersprungen zu werden.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/stoneintelligence/multilingual-e5-small
          key: multilingual-e5-small-761b726

      - name: Download embedding model
        run: |
          dir=~/.cache/stoneintelligence/multilingual-e5-small
          base=https://huggingface.co/Xenova/multilingual-e5-small/resolve/761b726dd34fb83930e26aab4e9ac3899aa1fa78
          mkdir -p "$dir"
          [ -f "$dir/model_quantized.onnx" ] || curl -sSfL -o "$dir/model_quantized.onnx" "$base/onnx/model_quantized.onnx"
          [ -f "$dir/tokenizer.json" ] || curl -sSfL -o "$dir/tokenizer.json" "$base/tokenizer.json"
          echo "f80102d3f2a1229f387d3c81909990d8945513e347b0eab049f7de3c6f98c193  $dir/model_quantized.onnx" | sha256sum -c -
          echo "0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39  $dir/tokenizer.json" | sha256sum -c -

      - name: Build and unit-test all modules
        run: ./mvnw -B -ntp verify
        env:
          MAVEN_REGISTRY_USERNAME: ${{ secrets.MAVEN_REGISTRY_USERNAME }}
          MAVEN_REGISTRY_PASSWORD: ${{ secrets.MAVEN_REGISTRY_PASSWORD }}

      - name: Upload surefire/failsafe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore

  # Die naechtliche Sicherung auf dorn (ops/backup) - gegen eine echte Wegwerf-Postgres.
  backup-script-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test backup script
        run: ops/backup/test-backup.sh
      - name: Test container healthcheck script
        run: ops/docker/test-healthcheck.sh

  # Die Dockerfiles bauen (ohne private Registry: platform-api, mcp-adapter) und der mcp-adapter
  # muss im Container "healthy" werden - prueft Healthcheck, Non-root-Nutzer und JVM-Flags.
  docker-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build platform-api image
        run: docker build -f platform-api/Dockerfile -t platform-api:ci .
      - name: Build mcp-adapter image
        run: docker build -f mcp-adapter/Dockerfile -t mcp-adapter:ci .
      - name: mcp-adapter becomes healthy and runs unprivileged
        run: |
          docker run -d --name mcp --cap-drop ALL --security-opt no-new-privileges:true mcp-adapter:ci
          for _ in $(seq 40); do
            state=$(docker inspect -f '{{.State.Health.Status}}' mcp)
            [ "$state" = healthy ] && break
            sleep 5
          done
          docker logs mcp | tail -20
          [ "$state" = healthy ]
          [ "$(docker exec mcp id -u)" != 0 ]

  # Bericht, kein Gatekeeper: bekannte Schwachstellen in Laufzeit-Abhaengigkeiten.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit (production dependencies, non-blocking)
        run: |
          for dir in plugin webapp yjs-bridge; do
            echo "::group::npm audit $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high) || echo "::warning::npm audit reported findings in $dir"
            echo "::endgroup::"
          done
      - name: Dependency review (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          fail-on-severity: high

  plugin-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build bundle
        run: node esbuild.config.mjs --production

  # Das Yjs-Bundle fuer die Java-API ist eingecheckt (platform-api/src/main/resources/yjs); dieser
  # Job stellt sicher, dass es exakt aus dem Quellcode (inkl. plugin/src/sync/textDiff.ts) entsteht.
  yjs-bridge-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            yjs-bridge/package-lock.json
            plugin/package-lock.json

      - name: Install dependencies (bridge imports the plugin's diff code)
        run: |
          (cd plugin && npm ci)
          (cd yjs-bridge && npm ci)

      - name: Typecheck and test
        working-directory: yjs-bridge
        run: |
          npx tsc --noEmit -p .
          npx vitest run

      - name: Bundle is up to date
        working-directory: yjs-bridge
        run: |
          npm run build
          git diff --exit-code -- ../platform-api/src/main/resources/yjs/yjs-bridge.js

  webapp-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile browser tests
        run: npm run test:e2e

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: webapp/test-results/
          if-no-files-found: ignore

      - name: Build
        run: npm run build
